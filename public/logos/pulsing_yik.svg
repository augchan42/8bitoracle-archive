<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Neon Chinese Character - Single Pulse</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .character-container {
            width: 300px;
            height: 300px;
        }
        .neon-character {
            fill: none;
            stroke: #00ff00;
            stroke-width: 1;
            filter: drop-shadow(0 0 2px #00ff00) drop-shadow(0 0 4px #00ff00);
            animation: neonPulse 2s ease-in-out forwards;
        }
        @keyframes neonPulse {
            0% {
                filter: drop-shadow(0 0 2px #00ff00) drop-shadow(0 0 4px #00ff00);
                stroke-width: 1;
            }
            50% {
                filter: drop-shadow(0 0 3px #00ff00) drop-shadow(0 0 6px #00ff00) drop-shadow(0 0 9px #00ff00);
                stroke-width: 1.5;
            }
            100% {
                filter: drop-shadow(0 0 2px #00ff00) drop-shadow(0 0 4px #00ff00);
                stroke-width: 1;
            }
        }
    </style>
</head>
